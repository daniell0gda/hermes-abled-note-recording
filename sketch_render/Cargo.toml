[package]
name = "sketch_render"
version = "0.1.0"
edition = "2021"
description = "Draws live-sketch diagrams as editorial SVG with orthogonal, rule-checked connectors"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sketch-render"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
