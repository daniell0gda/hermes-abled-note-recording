<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How hiring works · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .lede {
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .lede code { font-family: var(--font-mono); font-size: 0.85em; }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · show-me reference</p>
    <h1>How hiring works</h1>
    <p class="lede">Hand-drawn reference for the <code>hiring</code> test talk, to compare against the app's live output.</p>

    <svg viewBox="0 0 1376 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hiring-title hiring-desc">
      <title id="hiring-title">How hiring works</title>
      <desc id="hiring-desc">Swimlane showing hiring across the hiring manager, recruiter, engineers and HR: the job description is posted and screened, good candidates get a technical interview, then either a team interview or a polite rejection, and after the manager decides HR makes the offer and does onboarding.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="40" y1="40" x2="1336" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="136" x2="1336" y2="136" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="232" x2="1336" y2="232" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="328" x2="1336" y2="328" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="424" x2="1336" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="164" y1="40" x2="164" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <text x="48" y="91" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HIRING MANAGER</text>
      <text x="48" y="187" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECRUITER</text>
      <text x="48" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENGINEERS</text>
      <text x="48" y="379" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HR</text>

      <line x1="264" y1="112" x2="264" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="344" y1="184" x2="368" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M528,184 H532 Q540,184 540,176 V96 Q540,88 548,88 H552" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="632" y1="112" x2="632" y2="160" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M712,88 H808 Q816,88 816,96 V256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M896,280 H900 Q908,280 908,272 V96 Q908,88 916,88 H920" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1000" y1="112" x2="1000" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1080" y1="376" x2="1152" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="472" y="130" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="502" y="139" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOOD ONES</text>
      <rect x="640" y="130" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="654" y="139" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT</text>
      <rect x="728" y="70" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="79" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIKES THEM</text>
      <rect x="916" y="178" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="944" y="187" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEEDBACK</text>
      <rect x="1088" y="356" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1116" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IF SIGNED</text>

      <rect x="184" y="64" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write job description</text>

      <rect x="552" y="64" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Technical interview</text>

      <rect x="920" y="64" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1000" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decide</text>

      <rect x="184" y="160" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Post job</text>

      <rect x="368" y="160" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Screen candidates</text>
      <text x="448" y="197" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">short phone call</text>

      <rect x="552" y="160" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send polite rejection</text>

      <rect x="736" y="256" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="816" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Team interview</text>
      <text x="816" y="293" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">with two engineers</text>

      <rect x="920" y="352" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1000" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Make offer</text>

      <rect x="1152" y="352" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1232" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Onboarding paperwork</text>

      <line x1="40" y1="444" x2="1336" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="474" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="132" y="474" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="152" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Manager's decision</text>

      <line x1="268" y1="479" x2="296" y2="479" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="304" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow / handoff</text>

      <line x1="420" y1="479" x2="448" y2="479" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="456" y="482" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Rejection path</text>
    </svg>
  </div>
</body>
</html>
