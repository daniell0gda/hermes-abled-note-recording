[package]
name = "elbow"
version = "0.2.1"
edition = "2021"
description = "Draws editorial diagrams as SVG from a small JSON view, with orthogonal, rule-checked connectors"

[lib]
path = "src/lib.rs"

[[bin]]
name = "elbow"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
